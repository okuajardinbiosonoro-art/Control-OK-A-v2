name: Firmware Build

on:
  push:
    paths:
      - "platformio.ini"
      - "firmware/**"
      - ".github/workflows/firmware-build.yml"
  pull_request:
    paths:
      - "platformio.ini"
      - "firmware/**"
      - ".github/workflows/firmware-build.yml"
  workflow_dispatch:

jobs:
  build-firmware:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: python -m pip install --upgrade pip platformio

      - name: Compile Firmware (ESP32)
        run: pio run -e okua_node_esp32dev
