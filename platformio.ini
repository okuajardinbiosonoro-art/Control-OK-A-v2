[platformio]
default_envs = okua_node_esp32dev
src_dir = firmware/okua_node_udp_v1
include_dir = firmware/okua_node_udp_v1

[env:okua_node_esp32dev]
platform = espressif32 @ 6.7.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  adafruit/Adafruit NeoPixel @ ^1.12.5

[env:okua_ef4_field_led]
extends = env:okua_node_esp32dev
upload_port = COM6
monitor_port = COM6
build_flags =
  -D NODE_LABEL=\"EF4\"
  -D NODE_ID=20
  -D ACTIVE_MODE=MODE_FIELD
  -D ACTIVE_SENSOR=SENSOR_PLANT
  -D LED_PROFILE=LED_SIMPLE

[env:okua_ee4_field_led]
extends = env:okua_node_esp32dev
build_flags =
